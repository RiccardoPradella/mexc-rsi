name: RSI page
# GitHub starts scheduled jobs late (observed: every 2.5–5 h instead of 30 min). So each run keeps the page fresh by
# itself: it recalculates and republishes every 10 minutes (at :07, :17, :27, …) for up to 5.5 hours. One pass takes
# ~5.5 min (MEXC rate limit), and 6 publishes an hour stay under GitHub Pages' 10-builds-an-hour soft limit. The hourly schedule
# only (re)starts that loop; a newer run replaces the running one, so there is never more than one.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
concurrency:
  group: rsi-loop
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: recalculate and republish every 10 minutes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "rsi-bot"
          git config --global user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          while :; do
            if python rsi.py; then
              rm -rf /tmp/pub && mkdir /tmp/pub && cp site/index.html site/data.json /tmp/pub/ && touch /tmp/pub/.nojekyll
              # gh-pages holds only the latest page (one commit, force-pushed), so the repository never grows
              (cd /tmp/pub && git init -q -b gh-pages && git add -A && git commit -q -m "RSI $(date -u +%FT%H:%MZ)" \
                && git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages) \
                || echo "publish failed, retrying next round"
            fi
            now=$(date +%s); next=$(( ((now - 420) / 600 + 1) * 600 + 420 ))     # next :x7 minute
            [ $next -ge $end ] && break
            sleep $(( next - now ))
          done
