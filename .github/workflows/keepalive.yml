name: keepalive
# GitHub pauses scheduled workflows in public repos after 60 days without repository activity.
# This weekly one-line commit keeps the 30-minute RSI job running.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"      # Mondays 04:41 UTC
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive && git commit -q -m "keepalive $(date -u +%F)" && git push -q
